# Render 배포 설정 (https://render.com → New → Blueprint 에서 이 저장소를 고르면 아래대로 만들어진다)
# - 무료 요금제는 15분 동안 접속이 없으면 잠들고, 다시 열 때 30초~1분 걸린다
# - 무료 요금제는 서버가 다시 켜지면 data/ 에 저장한 데이터(가져온 파일, 입력한 사유)가 지워진다
services:
  - type: web
    name: oee-loss-analyzer
    runtime: node
    plan: free
    region: singapore        # 한국에서 가장 가까운 지역
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    autoDeploy: true         # GitHub main 에 올리면 자동으로 새 버전 배포
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Claude로 사유를 분류하려면 Render 화면의 Environment 에서 직접 넣는다 (저장소에 키를 적지 않는다)
      - key: ANTHROPIC_API_KEY
        sync: false
